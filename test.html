<!DOCTYPE html>
<html>
<head>
    <title>Map Test</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 20px; }
        #map { height: 500px; width: 100%; border: 2px solid #ccc; }
        .status { padding: 10px; margin: 10px 0; background: #f0f0f0; }
    </style>
</head>
<body>
    <h1>Map Test Page</h1>
    <div class="status" id="status">Initializing...</div>
    <div id="map"></div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const status = document.getElementById('status');
        
        try {
            if (typeof L === 'undefined') {
                status.innerHTML = 'ERROR: Leaflet not loaded';
                status.style.background = '#ffcccc';
            } else {
                status.innerHTML = 'Leaflet loaded successfully. Creating map...';
                const map = L.map('map').setView([-13.1339, 27.8493], 6);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors'
                }).addTo(map);
                
                setTimeout(() => {
                    map.invalidateSize();
                    status.innerHTML = 'SUCCESS: Map created and should be visible';
                    status.style.background = '#ccffcc';
                }, 500);
            }
        } catch (error) {
            status.innerHTML = 'ERROR: ' + error.message;
            status.style.background = '#ffcccc';
            console.error(error);
        }
    </script>
</body>
</html>
